# From a filled cart, as a guest: logs in, fills shipping and payment, and stops on the review screen.
# Each field is scrolled into view first and the keyboard is closed after typing: on a small screen the
# keyboard covers the next field.
appId: com.saucelabs.mydemoapp.android
---
- tapOn: "View cart"
- tapOn: "Confirms products for checkout"

# A guest is sent to login first, then back to the shipping step.
- runFlow:
    file: login.yaml
    env:
      USERNAME: "bod@example.com"
      PASSWORD: "10203040"

- assertVisible: "Enter a shipping address"
- runFlow: { file: fill_field.yaml, env: { FIELD: "fullNameET", VALUE: "Rebecca Winter" } }
- runFlow: { file: fill_field.yaml, env: { FIELD: "address1ET", VALUE: "Mandorley 112" } }
- runFlow: { file: fill_field.yaml, env: { FIELD: "cityET", VALUE: "Truro" } }
- runFlow: { file: fill_field.yaml, env: { FIELD: "zipET", VALUE: "89750" } }
- runFlow: { file: fill_field.yaml, env: { FIELD: "countryET", VALUE: "United Kingdom" } }
- scrollUntilVisible:
    element: "Saves user info for checkout"
- tapOn: "Saves user info for checkout"

- assertVisible: "Enter a payment method"
- runFlow: { file: fill_field.yaml, env: { FIELD: "nameET", VALUE: "Rebecca Winter" } }
- runFlow: { file: fill_field.yaml, env: { FIELD: "cardNumberET", VALUE: "3258125675687891" } }
- runFlow: { file: fill_field.yaml, env: { FIELD: "expirationDateET", VALUE: "0325" } }
- runFlow: { file: fill_field.yaml, env: { FIELD: "securityCodeET", VALUE: "123" } }
- scrollUntilVisible:
    element: "Saves payment info and launches screen to review checkout data"
- tapOn: "Saves payment info and launches screen to review checkout data"

- assertVisible: "Review your order"
