# Starts the app with its data cleared, so every flow begins with an empty cart and no login.
appId: com.saucelabs.mydemoapp.android
---
- launchApp:
    clearState: true
    permissions:
      all: allow
# A cold start right after clearing data can take a while on a CI emulator (software GPU).
- extendedWaitUntil:
    visible: "Displays all products of catalog"
    timeout: 60000
