# From anywhere in the app: opens the catalog, sorts it so PRODUCT is the first card, sets QUANTITY
# (default 1) and adds it to the cart.
#
# Why sort first: the app has a known, intentional crash when the 2nd card or the 7th onwards is tapped
# (see appium/test/specs/known-defects.spec.ts). Sorting puts the product in the 1st card, which is safe.
#   Sauce Labs Backpack -> SORT "Ascending order by name"
#   Sauce Labs Onesie   -> SORT "Ascending order by price"
#
# Defaults live in JavaScript, not in an `env:` block here: a subflow's own env block takes precedence over
# the env its caller passes, which silently ignored QUANTITY and SORT in an earlier version.
appId: com.saucelabs.mydemoapp.android
---
- evalScript: "${output.quantity = typeof QUANTITY === 'undefined' ? 1 : Number(QUANTITY)}"
- evalScript: "${output.sort = typeof SORT === 'undefined' ? 'Ascending order by name' : SORT}"
- runFlow:
    file: open_menu_item.yaml
    env:
      MENU_ITEM: "Catalog"
- tapOn: "Shows current sorting order and displays available sorting options"
- assertVisible: ${output.sort}
- tapOn: ${output.sort}
- waitForAnimationToEnd
- assertVisible:
    id: "(.*:id/)?titleTV"
    index: 0
    text: ${PRODUCT}
# Only the product image opens the product page; the title is not tappable.
- tapOn:
    id: "(.*:id/)?productIV"
    index: 0
- assertVisible:
    id: "(.*:id/)?productTV"
    text: ${PRODUCT}
- scrollUntilVisible:
    element: "Increase item quantity"
    direction: DOWN
- repeat:
    times: ${output.quantity - 1}
    commands:
      - tapOn: "Increase item quantity"
- assertVisible:
    id: "(.*:id/)?noTV"
    text: ${String(output.quantity)}
- scrollUntilVisible:
    element: "Tap to add product to cart"
    direction: DOWN
- tapOn: "Tap to add product to cart"
